<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人小站</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="site-header">
        <div class="container site-header__inner">
            <a class="site-logo" href="index.html">我的小站</a>
            <nav class="site-nav" aria-label="主导航">
                <ul>
                    <li><a href="index.html" aria-current="page">首页</a></li>
                    <li><a href="index.html#self-exploration">自我探索</a></li>
                    <li><a href="about.html">关于</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="site-main" id="main">
        <div class="container">
            <section id="intro" class="section" aria-labelledby="intro-heading">
                <h1 id="intro-heading" class="section__title">欢迎来到我的小空间</h1>
                <div class="card">
                    <p>这里放一些我自己喜欢的东西，后续我会不断更新内容。</p>
                </div>
            </section>

            <section id="self-exploration" class="section" aria-labelledby="self-exploration-heading">
                <h2 id="self-exploration-heading" class="section__title">自我探索</h2>
                <div class="card card--stack">
                    <h3 class="card__title">视觉构建</h3>
                    <ul class="list-plain card__sublist">
                        <li>3D 建模作品</li>
                        <li>场景渲染</li>
                        <li>模型设计 / 创意建模</li>
                    </ul>
                </div>
                <div class="card card--stack">
                    <h3 class="card__title">镜头记录</h3>
                    <ul class="list-plain card__sublist">
                        <li>摄影作品</li>
                        <li>生活瞬间</li>
                        <li>风光 / 人像 / 纪实</li>
                    </ul>
                </div>
                <div class="card card--stack">
                    <h3 class="card__title">声音印记</h3>
                    <ul class="list-plain card__sublist">
                        <li><a href="nfc-audio.html">NFC 触发音频</a></li>
                        <li>原创语音 / 音效</li>
                        <li>声音随笔、独白、故事</li>
                    </ul>
                    <p class="card__note">后续还会继续添加。</p>
                </div>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>© 我的小站 · 本地静态页，导航与样式可复用到新页面</p>
        </div>
    </footer>
</body>
</html>
